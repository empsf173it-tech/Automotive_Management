<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Veloce Motors Client Portal</title>
  <meta name="description" content="Sign in to your Veloce Motors account to access vehicle telemetry logs, track day reservations, service invoices, and dashboard analytics.">
  <meta name="keywords" content="Veloce Login, Client Portal, Automotive Account Login">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Favicon Brand Logo -->
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  
  <!-- Custom Style -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Standalone Auth Section (Navbar & Footer Removed) -->
  <section class="auth-section">
    <div class="container d-flex flex-column align-items-center">

      <div class="auth-card">
        <!-- Brand Header inside Auth Card -->
        <div class="text-center mb-4">
          <a class="navbar-brand justify-content-center mb-3 text-decoration-none" href="index.html">
            <i class="bi bi-speedometer2 text-accent fs-2 me-2"></i> VELOCE<span class="text-accent">MOTORS</span>
          </a>
          <h1 class="h3 fw-bold mt-2 mb-1">Welcome Back</h1>
          <p class="opacity-75 fs-6 mb-0">Access your Veloce Telemetry & Client Portal</p>
        </div>

        <!-- Alert Container -->
        <div id="loginAlert" class="alert d-none mb-4" role="alert"></div>

        <form id="loginForm" action="dashboard.html" method="GET" novalidate>
          <div class="mb-3">
            <label class="form-label opacity-75" for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" class="form-control form-control-custom" placeholder="name@domain.com" required value="owner@velocemotors.com">
          </div>

          <div class="mb-3">
            <label class="form-label opacity-75" for="loginPassword">Password</label>
            <div class="input-group mb-1">
              <input type="password" id="loginPassword" class="form-control form-control-custom" placeholder="••••••••" required value="password123">
              <button class="btn btn-password-toggle" type="button" id="toggleLoginPassword" aria-label="Toggle password visibility"><i class="bi bi-eye"></i></button>
            </div>
            <div class="text-end">
              <a href="#" id="forgotPasswordBtn" class="text-accent fs-6 text-decoration-none">Forgot password?</a>
            </div>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input bg-primary-dark border-secondary" type="checkbox" id="rememberMe" checked>
            <label class="form-check-label opacity-75 fs-6 ms-2" for="rememberMe">Remember this browser</label>
          </div>

          <button type="submit" id="loginSubmitBtn" class="btn-accent w-100 py-3 mb-3"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal</button>

          <p class="text-center opacity-75 fs-6 mb-0">
            Don't have an account? <a href="signup.html" class="text-accent fw-semibold text-decoration-none">Create one</a>
          </p>
        </form>

        <!-- Divider Line -->
        <div class="position-relative text-center my-4">
          <hr class="border-secondary opacity-25">
          <span class="position-absolute top-50 start-50 translate-middle px-3 bg-card-custom opacity-75 fs-6">or sign in with</span>
        </div>

        <!-- Social Login Icons at the bottom -->
        <div class="row g-2">
          <div class="col-4">
            <button type="button" class="social-login-btn w-100"><i class="bi bi-google text-danger me-1"></i> Google</button>
          </div>
          <div class="col-4">
            <button type="button" class="social-login-btn w-100"><i class="bi bi-apple me-1"></i> Apple</button>
          </div>
          <div class="col-4">
            <button type="button" class="social-login-btn w-100"><i class="bi bi-facebook text-primary me-1"></i> Meta</button>
          </div>
        </div>
      </div>

    </div>
  </section>

  <button id="backToTop" class="back-to-top" aria-label="Back to top">
    <i class="bi bi-arrow-up"></i>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
