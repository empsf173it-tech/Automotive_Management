<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Veloce Motors Registration</title>
  <meta name="description" content="Register for a Veloce Motors account to schedule ECU dyno tuning, track day events, and access your hypercar telemetry portal.">
  <meta name="keywords" content="Veloce Signup, Create Account, Supercar Client Registration">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Favicon Brand Logo -->
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  
  <!-- Custom Style -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Standalone Auth Section (Navbar & Footer Removed) -->
  <section class="auth-section">
    <div class="container d-flex flex-column align-items-center">

      <div class="auth-card">
        <!-- Brand Header inside Auth Card -->
        <div class="text-center mb-4">
          <a class="navbar-brand justify-content-center mb-3 text-decoration-none" href="index.html">
            <i class="bi bi-speedometer2 text-accent fs-2 me-2"></i> VELOCE<span class="text-accent">MOTORS</span>
          </a>
          <h1 class="h3 fw-bold mt-2 mb-1">Create Account</h1>
          <p class="opacity-75 fs-6 mb-0">Join the Veloce Automotive Community</p>
        </div>

        <!-- Alert Container -->
        <div id="signupAlert" class="alert d-none mb-4" role="alert"></div>

        <form id="signupForm" action="dashboard.html" method="GET" novalidate>
          <div class="row g-2 mb-3">
            <div class="col-12 col-sm-6">
              <label class="form-label opacity-75" for="firstName">First Name</label>
              <input type="text" id="firstName" class="form-control form-control-custom" placeholder="Sebastian" required>
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label opacity-75" for="lastName">Last Name</label>
              <input type="text" id="lastName" class="form-control form-control-custom" placeholder="Vettel" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label opacity-75" for="signupEmail">Email Address</label>
            <input type="email" id="signupEmail" class="form-control form-control-custom" placeholder="s.vettel@f1.com" required>
          </div>

          <div class="mb-3">
            <label class="form-label opacity-75" for="vehicleMake">Primary Vehicle Make & Model</label>
            <input type="text" id="vehicleMake" class="form-control form-control-custom" placeholder="e.g. Ferrari 488 / Porsche 911" required>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <label class="form-label opacity-75" for="signupPassword">Password</label>
              <div class="input-group">
                <input type="password" id="signupPassword" class="form-control form-control-custom" placeholder="Min. 8 characters" minlength="8" required>
                <button class="btn btn-password-toggle" type="button" id="toggleSignupPassword" aria-label="Toggle password visibility"><i class="bi bi-eye"></i></button>
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label opacity-75" for="confirmPassword">Confirm Password</label>
              <div class="input-group">
                <input type="password" id="confirmPassword" class="form-control form-control-custom" placeholder="Re-enter password" required>
                <button class="btn btn-password-toggle" type="button" id="toggleConfirmPassword" aria-label="Toggle confirm password visibility"><i class="bi bi-eye"></i></button>
              </div>
            </div>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input bg-primary-dark border-secondary" type="checkbox" id="termsCheck" required checked>
            <label class="form-check-label opacity-75 fs-6 ms-2" for="termsCheck">
              I agree to the <a href="privacy.html" class="text-accent text-decoration-none">Terms of Service</a> & Privacy Policy
            </label>
          </div>

          <button type="submit" id="signupSubmitBtn" class="btn-accent w-100 py-3 mb-3"><i class="bi bi-person-check-fill me-1"></i> Register Account</button>

          <p class="text-center opacity-75 fs-6 mb-0">
            Already have an account? <a href="login.html" class="text-accent fw-semibold text-decoration-none">Sign In</a>
          </p>
        </form>

        <!-- Divider Line -->
        <div class="position-relative text-center my-4">
          <hr class="border-secondary opacity-25">
          <span class="position-absolute top-50 start-50 translate-middle px-3 bg-card-custom opacity-75 fs-6">or register with</span>
        </div>

        <!-- Social Signup at the bottom -->
        <div class="row g-2">
          <div class="col-4">
            <button type="button" class="social-login-btn w-100"><i class="bi bi-google text-danger me-1"></i> Google</button>
          </div>
          <div class="col-4">
            <button type="button" class="social-login-btn w-100"><i class="bi bi-apple me-1"></i> Apple</button>
          </div>
          <div class="col-4">
            <button type="button" class="social-login-btn w-100"><i class="bi bi-facebook text-primary me-1"></i> Meta</button>
          </div>
        </div>
      </div>

    </div>
  </section>

  <button id="backToTop" class="back-to-top" aria-label="Back to top">
    <i class="bi bi-arrow-up"></i>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
